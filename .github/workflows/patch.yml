name: Обновление сайта от YSD DEV
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Применить правку поверх текущего сайта (без перезаписи)
        run: |
          git init site && cd site
          git fetch https://github.com/${{ github.repository }}.git gh-pages
          git checkout -b gh-pages FETCH_HEAD
          git fetch https://github.com/ysddev/ysdprojects.git fond-patch
          git merge --ff-only FETCH_HEAD
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
